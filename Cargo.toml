[package]
name = "fuckmiit"
version = "0.1.0"
edition = "2024"
description = "MIIT ICP filing query client"
license = "WTFPL"
repository = "https://github.com/pysio2007/fuckmiit"

[dependencies]
base64 = "0.22"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
